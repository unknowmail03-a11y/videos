<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MP4 Video Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col overflow-x-hidden selection:bg-indigo-500 selection:text-white bg-slate-950">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40 px-4 md:px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center">
                <i class="fa-solid fa-film text-base"></i>
            </div>
            <div>
                <h1 class="text-sm font-semibold text-slate-100">MP4 Video Gallery</h1>
                <p id="status-text" class="text-[11px] text-slate-400">Scanning local folder...</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Manual File / Folder Input Fallback -->
            <label class="cursor-pointer px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700/80 text-xs font-medium text-slate-200 transition flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-indigo-400"></i>
                <span>Open Folder / Files</span>
                <input type="file" id="file-input" accept="video/mp4,video/*" multiple webkitdirectory class="hidden" />
            </label>
            <button onclick="init()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="Rescan Folder">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
        </div>
    </header>

    <div id="app" class="flex-1 w-full p-4 md:p-6 flex flex-col">
        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-10 flex-1 items-start">
            <!-- Loading State -->
            <div id="loading-state" class="col-span-full flex flex-col items-center justify-center py-32 px-4 text-center">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mb-4 border border-indigo-500/30 animate-spin">
                    <i class="fa-solid fa-circle-notch text-xl"></i>
                </div>
                <h3 class="text-sm font-medium text-slate-300">Scanning directory for MP4 videos...</h3>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl hidden flex items-center justify-center p-4 md:p-10 opacity-0 transition-opacity duration-300">
        <div class="relative w-full max-w-5xl bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/50">
                <h3 id="modal-title" class="font-medium text-sm text-slate-200 truncate pr-4">Video Preview</h3>
                <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden p-2">
                <video id="modal-video" controls class="max-h-[75vh] w-auto max-w-full rounded-xl shadow-2xl" preload="metadata"></video>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const container = document.getElementById('grid-container');
            const statusEl = document.getElementById('status-text');
            const fileInput = document.getElementById('file-input');

            function escapeHtml(str) {
                return String(str).replace(/[&<"']/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#39;' }[m];
                });
            }

            function openModal(url, title) {
                const modal = document.getElementById('video-modal');
                const video = document.getElementById('modal-video');
                const titleEl = document.getElementById('modal-title');
                titleEl.textContent = title || 'Video Preview';
                video.src = url;
                modal.classList.remove('hidden');
                requestAnimationFrame(() => {
                    modal.classList.remove('opacity-0');
                    video.play().catch(() => {});
                });
            }
            window.openModal = openModal;

            function closeModal() {
                const modal = document.getElementById('video-modal');
                const video = document.getElementById('modal-video');
                modal.classList.add('opacity-0');
                video.pause();
                video.src = '';
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
            window.closeModal = closeModal;

            async function discoverMp4Files() {
                const seen = new Map();

                function addVideo(rawPath) {
                    if (!rawPath) return;
                    let clean = rawPath.split('?')[0].split('#')[0];
                    if (!clean.toLowerCase().endsWith('.mp4')) return;

                    let decodedName = clean;
                    try {
                        decodedName = decodeURIComponent(clean);
                    } catch (e) {}

                    const fileName = decodedName.split('/').pop().trim();
                    if (fileName && !seen.has(fileName.toLowerCase())) {
                        seen.set(fileName.toLowerCase(), {
                            name: fileName,
                            url: rawPath
                        });
                    }
                }

                // Standard endpoint targets to check
                const targets = [
                    location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1) || './',
                    './'
                ];

                for (const target of targets) {
                    try {
                        const response = await fetch(target, { cache: 'no-store' });
                        if (!response.ok) continue;

                        const contentType = response.headers.get('content-type') || '';
                        const text = await response.text();

                        if (contentType.includes('application/json')) {
                            try {
                                const json = JSON.parse(text);
                                const files = Array.isArray(json) ? json : (json.files || json.contents || []);
                                files.forEach(f => {
                                    const path = typeof f === 'string' ? f : (f.name || f.path);
                                    addVideo(path);
                                });
                            } catch (e) {}
                        } else {
                            // Method 1: DOM Parsing for standard HTML directory listings (Apache, Nginx, Python http.server)
                            const doc = new DOMParser().parseFromString(text, 'text/html');
                            const links = doc.querySelectorAll('a[href], area[href]');
                            links.forEach(a => {
                                const href = a.getAttribute('href');
                                addVideo(href);
                            });

                            // Method 2: Regex scanning for custom text listings or raw string references
                            const regex = /(?:href|src)=["']?([^"'` >]+?\.mp4(?:\?[^"'` >]*)?)["']?|([a-zA-Z0-9_\-\s%.\(\)]+\.mp4)/gi;
                            let match;
                            while ((match = regex.exec(text)) !== null) {
                                const candidate = match[1] || match[2];
                                addVideo(candidate);
                            }
                        }
                    } catch (err) {
                        console.warn('Fetch error for target', target, err);
                    }

                    if (seen.size > 0) break;
                }

                return Array.from(seen.values());
            }

            function renderGrid(videos) {
                if (statusEl) {
                    statusEl.textContent = videos.length > 0 ? `Found ${videos.length} MP4 video${videos.length === 1 ? '' : 's'}` : 'No videos found';
                }

                if (!videos || videos.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full flex flex-col items-center justify-center py-28 px-4 text-center">
                            <div class="w-14 h-14 rounded-2xl bg-slate-800/50 text-slate-500 flex items-center justify-center mb-4 border border-slate-700/50">
                                <i class="fa-regular fa-file-video text-2xl"></i>
                            </div>
                            <p class="text-sm font-medium text-slate-300">No MP4 videos detected in this folder</p>
                            <p class="text-xs text-slate-500 max-w-sm mt-1.5 leading-relaxed">
                                Ensure directory indexing is enabled on your local web server, or click <strong>"Open Folder / Files"</strong> above to select videos directly.
                            </p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                videos.forEach(v => {
                    const encodedUrl = v.url;
                    const safeName = escapeHtml(v.name);
                    html += `
                        <div class="group bg-slate-900/80 rounded-2xl overflow-hidden border border-slate-800/80 shadow-lg hover:border-indigo-500/50 transition-all duration-300 flex flex-col">
                            <div class="relative w-full bg-black/50 overflow-hidden flex items-center justify-center aspect-video">
                                <video 
                                    src="${encodedUrl}" 
                                    preload="metadata" 
                                    muted 
                                    loop 
                                    playsinline
                                    class="w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-500 cursor-pointer"
                                    onmouseenter="this.play().catch(()=>{})" 
                                    onmouseleave="this.pause(); this.currentTime = 0;"
                                    onclick="openModal('${encodedUrl}', '${safeName}')"
                                ></video>
                                <div class="absolute inset-0 bg-slate-950/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                                    <div class="w-12 h-12 rounded-full bg-indigo-600/90 text-white flex items-center justify-center shadow-xl transform scale-90 group-hover:scale-100 transition">
                                        <i class="fa-solid fa-play ml-0.5"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="p-3.5 flex items-center justify-between gap-2 bg-slate-900/60">
                                <div class="min-w-0 flex-1">
                                    <h4 class="text-xs font-medium text-slate-200 truncate" title="${safeName}">${safeName}</h4>
                                    <p class="text-[11px] text-slate-400 mt-0.5">MP4 Video</p>
                                </div>
                                <button onclick="openModal('${encodedUrl}', '${safeName}')" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white flex items-center justify-center transition shrink-0">
                                    <i class="fa-solid fa-expand text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            async function init() {
                container.innerHTML = `
                    <div id="loading-state" class="col-span-full flex flex-col items-center justify-center py-32 px-4 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mb-4 border border-indigo-500/30 animate-spin">
                            <i class="fa-solid fa-circle-notch text-xl"></i>
                        </div>
                        <h3 class="text-sm font-medium text-slate-300">Scanning directory for MP4 videos...</h3>
                    </div>
                `;
                if (statusEl) statusEl.textContent = 'Scanning local folder...';
                
                const videos = await discoverMp4Files();
                renderGrid(videos);
            }
            window.init = init;

            // Handle manual local file selecting
            if (fileInput) {
                fileInput.addEventListener('change', (e) => {
                    const files = Array.from(e.target.files || []).filter(f => f.name.toLowerCase().endsWith('.mp4'));
                    if (files.length > 0) {
                        const videoList = files.map(file => ({
                            name: file.name,
                            url: URL.createObjectURL(file)
                        }));
                        renderGrid(videoList);
                    }
                });
            }

            // Close modal on background click or ESC key
            document.getElementById('video-modal').addEventListener('click', (e) => {
                if (e.target.id === 'video-modal') closeModal();
            });
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
