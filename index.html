<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for immersive sleek dark mode */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <div id="app" class="flex-1 w-full p-4 md:p-6 flex flex-col">
        
        <!-- Top Floating Control Bar (Subtle, minimalist, collapsible or overlay) -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-xl transition-all">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600/20 text-indigo-400 p-2.5 rounded-xl border border-indigo-500/30">
                    <i class="fa-solid fa-clapperboard text-lg"></i>
                </div>
                <div>
                    <h1 class="font-semibold text-base text-slate-200 tracking-tight">MP4 Video Grid</h1>
                    <p class="text-xs text-slate-400" id="video-count">Loading videos...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Folder Picker Input -->
                <label class="cursor-pointer inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/20 active:scale-95">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Select Folder</span>
                    <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden">
                </label>

                <!-- Add Individual Files -->
                <label class="cursor-pointer inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl font-medium text-sm transition border border-slate-700 active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Files</span>
                    <input type="file" id="file-input" accept="video/mp4" multiple class="hidden">
                </label>

                <!-- Grid Column Size Toggle -->
                <div class="hidden sm:flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
<body class="h-full text-slate-100 flex flex-col overflow-x-hidden selection:bg-indigo-500 selection:text-white bg-slate-950">

    <div id="app" class="flex-1 w-full p-4 md:p-6 flex flex-col">
        
        <!-- Floating Status / Error Indicator (Only visible if needed) -->
        <div id="status-banner" class="hidden mb-4 bg-amber-500/10 border border-amber-500/30 text-amber-200 px-4 py-3 rounded-2xl text-sm flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
            <span id="status-text">Scanning folder...</span>
        </div>

        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-10 flex-1 items-start">
            <!-- Loading State -->
            <div id="loading-state" class="col-span-full flex flex-col items-center justify-center py-32 px-4 text-center">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mb-4 border border-indigo-500/30 animate-spin">
                    <i class="fa-solid fa-circle-notch text-xl"></i>
                </div>
                <h3 class="text-sm font-medium text-slate-300">Scanning same folder for MP4 videos...</h3>
                <p class="text-xs text-slate-500 mt-1">If directory listing is restricted by your local browser security, see helper instructions below.</p>
            </div>
        </div>
    </div>

    <div id="video-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl hidden flex items-center justify-center p-4 md:p-10 opacity-0 transition-opacity duration-300">
        <div class="relative w-full max-w-5xl bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/50">
                <h3 id="modal-title" class="font-medium text-sm text-slate-200 truncate pr-4">Video Preview</h3>
                <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden p-2">
                <video id="modal-video" controls class="max-h-[75vh] w-auto max-w-full rounded-xl shadow-2xl" preload="metadata"></video>
            </div>
        </div>
    </div>

    <script>
        let videoList = [];

        // Automatically fetch videos from the same folder on load
        window.addEventListener('DOMContentLoaded', () => {
            discoverVideosInSameFolder();
        });

        async function discoverVideosInSameFolder() {
            const container = document.getElementById('grid-container');
            const statusBanner = document.getElementById('status-banner');
            const statusText = document.getElementById('status-text');

            // Common list of candidate video filenames or we can attempt directory fetch via Fetch API / HTML scraping if served via a local web server (like python -m http.server)
            try {
                // Attempt to fetch index or directory listing if supported by local web server
                const response = await fetch('./');
                if (response.ok) {
                    const htmlText = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const links = doc.querySelectorAll('a');
                    
                    const foundVideos = [];
                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.toLowerCase().endsWith('.mp4')) {
                            const decodedName = decodeURIComponent(href.split('/').pop());
                            foundVideos.push({
                                name: decodedName,
                                url: href,
                                size: 'Local file'
                            });
                        }
                    });

                    if (foundVideos.length > 0) {
                        videoList = foundVideos;
                        renderGrid();
                        return;
                    }
                }
            } catch (err) {
                console.log('Direct directory index fetch not available (likely opened via file:// protocol). Falling back to sample or manual scan.', err);
            }

            // Fallback: If opened via file:// or no server index listing, check common sequential names or allow user drop / manual list
            // Let's test a sensible default range or show instructions to run a simple local server if opened via file://
            if (window.location.protocol === 'file:') {
                statusBanner.classList.remove('hidden');
                statusText.innerHTML = `Browsers restrict automatic folder scanning on <code class="bg-black/40 px-1.5 py-0.5 rounded text-indigo-300">file://</code> URLs. To auto-load videos from the same folder, run a quick local server (e.g. <code class="bg-black/40 px-1.5 py-0.5 rounded text-indigo-300">python3 -m http.server</code>) or drag & drop your videos here!`;
            }

            // Let's also listen to drag and drop anywhere so users can easily drop their videos
            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer && e.dataTransfer.files) {
                    handleDroppedFiles(e.dataTransfer.files);
                }
            });

            // If still empty after attempts, show an elegant drop zone prompt
            if (videoList.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-28 px-4 text-center border-2 border-dashed border-slate-800 rounded-3xl bg-slate-900/20 hover:bg-slate-900/40 transition">
                        <div class="w-16 h-16 rounded-2xl bg-indigo-600/10 text-indigo-400 flex items-center justify-center mb-4 border border-indigo-500/20">
                            <i class="fa-solid fa-film text-2xl"></i>
                        </div>
                        <h3 class="text-base font-semibold text-slate-200 mb-1">No MP4 files automatically detected</h3>
                        <p class="text-xs text-slate-400 max-w-md mb-4">If you are running via a local server in the video folder, check filenames. Alternatively, drag & drop your MP4 files directly onto this window.</p>
                        <div class="inline-flex items-center gap-2 text-xs text-slate-500 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                            <i class="fa-solid fa-bolt text-amber-400"></i> Zero headers & zero footers — pure auto-height video grid.
                        </div>
                    </div>
                `;
            }
        }

        function handleDroppedFiles(files) {
            const newVideos = [];
            for (let file of files) {
                if (file.type === 'video/mp4' || file.name.toLowerCase().endsWith('.mp4')) {
                    const url = URL.createObjectURL(file);
                    newVideos.push({
                        name: file.name,
                        size: formatBytes(file.size),
                        url: url
                    });
                }
            }
            if (newVideos.length > 0) {
                videoList = [...videoList, ...newVideos];
                renderGrid();
            }
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function renderGrid() {
            const container = document.getElementById('grid-container');
            const statusBanner = document.getElementById('status-banner');
            if (statusBanner) statusBanner.classList.add('hidden');

            if (videoList.length === 0) return;

            let html = '';
            videoList.forEach((video) => {
                html += `
                    <div class="group bg-slate-900/80 rounded-2xl overflow-hidden border border-slate-800/80 shadow-lg hover:border-indigo-500/50 transition-all duration-300 flex flex-col">
                        <!-- Video Container with auto-height preservation -->
                        <div class="relative w-full bg-black/50 overflow-hidden flex items-center justify-center">
                            <video 
                                src="${video.url}" 
                                preload="metadata" 
                                muted 
                                loop
                                class="w-full h-auto max-h-[400px] object-cover group-hover:scale-[1.02] transition-transform duration-500 cursor-pointer"
                                onmouseenter="this.play()" 
                                onmouseleave="{this.pause(); this.currentTime = 0;}"
                                onclick="openModal('${video.url}', '${escapeHtml(video.name)}')"
                            ></video>
                            
                            <!-- Overlay Play Button Badge -->
                            <div class="absolute inset-0 bg-slate-950/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                                <div class="w-12 h-12 rounded-full bg-indigo-600/90 text-white flex items-center justify-center shadow-xl transform scale-90 group-hover:scale-100 transition">
                                    <i class="fa-solid fa-play ml-0.5"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Video Metadata & Quick Actions -->
                        <div class="p-3.5 flex items-center justify-between gap-2 bg-slate-900/60">
                            <div class="min-w-0 flex-1">
                                <h4 class="text-xs font-medium text-slate-200 truncate" title="${escapeHtml(video.name)}">${escapeHtml(video.name)}</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">${video.size || 'MP4 Video'}</p>
                            </div>
                            <button onclick="openModal('${video.url}', '${escapeHtml(video.name)}')" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white flex items-center justify-center transition shrink-0">
                                <i class="fa-solid fa-expand text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        function openModal(url, title) {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('modal-video');
            const titleEl = document.getElementById('modal-title');

            titleEl.textContent = title;
            video.src = url;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                video.play();
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('modal-video');

            modal.classList.add('opacity-0');
            video.pause();
            video.src = '';
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') closeModal();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
