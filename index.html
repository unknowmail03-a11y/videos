<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col overflow-x-hidden selection:bg-indigo-500 selection:text-white bg-slate-950">

    <div id="app" class="flex-1 w-full p-4 md:p-6 flex flex-col">
        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-10 flex-1 items-start">
            <!-- Loading State -->
            <div id="loading-state" class="col-span-full flex flex-col items-center justify-center py-32 px-4 text-center">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mb-4 border border-indigo-500/30 animate-spin">
                    <i class="fa-solid fa-circle-notch text-xl"></i>
                </div>
                <h3 class="text-sm font-medium text-slate-300">Loading videos from folder...</h3>
            </div>
        </div>
    </div>

    <div id="video-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl hidden flex items-center justify-center p-4 md:p-10 opacity-0 transition-opacity duration-300">
        <div class="relative w-full max-w-5xl bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/50">
                <h3 id="modal-title" class="font-medium text-sm text-slate-200 truncate pr-4">Video Preview</h3>
                <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden p-2">
                <video id="modal-video" controls class="max-h-[75vh] w-auto max-w-full rounded-xl shadow-2xl" preload="metadata"></video>
            </div>
        </div>
    </div>

    <script>
        // Exact list of videos located in the same folder as index.html
        const knownVideoFiles = [
            "ANALYTIC PAGE.mp4",
            "DEBTORS return and refund.mp4",
            "DESKTOP VIDEO ABOUT POS PAGE.mp4",
            "Only Assign barcode.mp4",
            "POS return and refund.mp4",
            "Suki points page.mp4",
            "Where to connect printer.mp4",
            "ad 3.mp4",
            "ad 4.mp4",
            "ad 6.mp4",
            "ad1.mp4",
            "add cost for profit.mp4",
            "add customer, enable rewards, add re...mp4",
            "add stocks each item on inventory.mp4",
            "add stocks using restocking within app...mp4",
            "add-product-using-bulk-add-product....mp4",
            "asign-categories.mp4",
            "cashier page add cashier block cashier...mp4",
            "change total amount on cart each item....mp4",
            "debtor partial paid add item qty.mp4",
            "finance add amount, categories, incom...mp4",
            "tiktok_1_V1.mp4"
        ];

        window.addEventListener('DOMContentLoaded', () => {
            loadVideos();
        });

        async function loadVideos() {
            const container = document.getElementById('grid-container');
            let videoList = [];

            // First try to dynamically scan directory via fetch if hosted on local server
            try {
                const response = await fetch('./');
                if (response.ok) {
                    const htmlText = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    const links = doc.querySelectorAll('a');
                    
                    const found = [];
                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.toLowerCase().endsWith('.mp4')) {
                            const decodedName = decodeURIComponent(href.split('/').pop());
                            found.push({
                                name: decodedName,
                                url: href
                            });
                        }
                    });
                    if (found.length > 0) {
                        videoList = found;
                    }
                }
            } catch (e) {
                console.log('Static directory fetch skipped.');
            }

            // Fallback or combine with the known repository file list
            if (videoList.length === 0) {
                videoList = knownVideoFiles.map(filename => ({
                    name: filename,
                    url: encodeURIComponent(filename).replace(/%20/g, ' ') // properly format local relative URL
                }));
            }

            renderGrid(videoList);
        }

        function renderGrid(videos) {
            const container = document.getElementById('grid-container');
            if (!videos || videos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-28 text-center">
                        <p class="text-sm text-slate-400">No MP4 videos found in this folder.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            videos.forEach((video) => {
                // Ensure correct relative path encoding
                const encodedUrl = video.url.includes('/') ? video.url : encodeURI(video.name);
                html += `
                    <div class="group bg-slate-900/80 rounded-2xl overflow-hidden border border-slate-800/80 shadow-lg hover:border-indigo-500/50 transition-all duration-300 flex flex-col">
                        <!-- Auto-height video container -->
                        <div class="relative w-full bg-black/50 overflow-hidden flex items-center justify-center">
                            <video 
                                src="${encodedUrl}" 
                                preload="metadata" 
                                muted 
                                loop
                                class="w-full h-auto max-h-[420px] object-cover group-hover:scale-[1.02] transition-transform duration-500 cursor-pointer"
                                onmouseenter="this.play()" 
                                onmouseleave="{this.pause(); this.currentTime = 0;}"
                                onclick="openModal('${encodedUrl}', '${escapeHtml(video.name)}')"
                            ></video>
                            
                            <div class="absolute inset-0 bg-slate-950/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                                <div class="w-12 h-12 rounded-full bg-indigo-600/90 text-white flex items-center justify-center shadow-xl transform scale-90 group-hover:scale-100 transition">
                                    <i class="fa-solid fa-play ml-0.5"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Video Title Bar -->
                        <div class="p-3.5 flex items-center justify-between gap-2 bg-slate-900/60">
                            <div class="min-w-0 flex-1">
                                <h4 class="text-xs font-medium text-slate-200 truncate" title="${escapeHtml(video.name)}">${escapeHtml(video.name)}</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">MP4 Video</p>
                            </div>
                            <button onclick="openModal('${encodedUrl}', '${escapeHtml(video.name)}')" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white flex items-center justify-center transition shrink-0">
                                <i class="fa-solid fa-expand text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<"']/g, function (m) {
                return { '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        function openModal(url, title) {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('modal-video');
            const titleEl = document.getElementById('modal-title');

            titleEl.textContent = title;
            video.src = url;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                video.play();
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const video = document.getElementById('modal-video');

            modal.classList.add('opacity-0');
            video.pause();
            video.src = '';
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') closeModal();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
